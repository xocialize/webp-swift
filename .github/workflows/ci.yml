name: ci

# NET-CLEAN GATE — the same gate media-bridge runs, for the package that carries the one codec
# media-bridge will not: libwebp, vendored AS SOURCE. The doctrine this job enforces:
#   · no binaryTarget, no `.unsafeFlags` — the package is consumed from a tagged URL;
#   · no assembly under Sources/CWebP — libwebp has never shipped any, and "from source, compiled
#     by SwiftPM's clang" is the whole reason this is not an xcframework;
#   · no MLX / FFmpeg / copyleft anywhere in the dependency closure (media-bridge + matroska-swift);
#   · a LICENSE on disk — a public repo without one is all-rights-reserved by default.
#
# Build on latest-stable Xcode, not the beta (media-bridge learned this the hard way: four
# releases compiled only on the dev machine's beta toolchain). If a change compiles locally but
# fails here, trust this job.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Report toolchain
        run: swift --version

      - name: Assert net-clean
        run: |
          swift package resolve
          fail=0
          if grep -riE '"mlx-swift"|mlx-engine-swift' Package.resolved; then
            echo "::error::MLX entered the dependency graph"; fail=1
          fi
          if grep -riE 'ffmpeg|libav|libvpx|libjxl|libvmaf|oxipng|dav1d|x264|x265' Package.resolved; then
            echo "::error::a non-canonical media dependency entered the graph"; fail=1
          fi
          if sed -E 's,[[:space:]]//.*,,; /^[[:space:]]*\/\//d' Package.swift \
               | grep -nE '\.binaryTarget|\.unsafeFlags'; then
            echo "::error::binaryTarget/unsafeFlags in Package.swift — breaks tagged-URL consumption"; fail=1
          fi
          asm=$(find Sources/CWebP \( -name '*.s' -o -name '*.S' -o -name '*.asm' \) | wc -l | tr -d ' ')
          if [ "$asm" != "0" ]; then
            echo "::error::$asm assembly file(s) under Sources/CWebP — the from-source target is no longer the whole story"; fail=1
          fi
          test -f LICENSE || { echo "::error::LICENSE missing"; fail=1; }
          test -f THIRD-PARTY-NOTICES.txt || { echo "::error::THIRD-PARTY-NOTICES.txt missing (libwebp COPYING + PATENTS)"; fail=1; }
          exit $fail

      - name: Build
        run: swift build -v

      # Self-contained: the corpus parity test XCTSkips without FORGE_CORPUS (eval-only local media).
      - name: Test
        run: swift test
